version: 2
updates:
  # Monorepo com npm workspaces: o package-lock.json unico fica na raiz,
  # entao o Dependabot olha a raiz e atualiza apps/api e apps/web juntos.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Versoes grandes que ainda nao dao para subir (revisar de tempos em tempos):
    # - Prisma 7: exige migracao (prisma.config.ts, driver adapters) e hoje traz
    #   vulnerabilidades altas via mysql2/deepmerge-ts.
    # - ESLint 10: o eslint-plugin-react do eslint-config-next ainda nao suporta.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      # Pacotes que precisam subir juntos (versoes casadas) viram um PR so,
      # em vez de um PR por pacote que nunca passa no CI sozinho.
      nestjs:
        patterns: ["@nestjs/*"]
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-*", "prettier", "globals"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
