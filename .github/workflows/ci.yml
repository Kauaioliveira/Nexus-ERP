name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_erp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    # Valores descartaveis, so para o banco efemero do CI. Nao sao segredos.
    env:
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_erp?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FISCAL_PROVIDER: sandbox
      BARCODE_LOOKUP: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=apps/api
      - run: npx tsc --noEmit -p apps/api/tsconfig.json
      - run: npm run lint --workspace=apps/api
      - run: npm run test --workspace=apps/api -- --ci --coverage
      - run: npm run prisma:deploy --workspace=apps/api
      - run: npm run test:e2e --workspace=apps/api -- --ci --runInBand
      - run: npm run build --workspace=apps/api

  web:
    runs-on: ubuntu-latest
    env:
      API_URL: http://localhost:3333/v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=apps/web
      - run: npm run build --workspace=apps/web

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Falha o CI se entrar dependencia de producao com vulnerabilidade alta ou critica.
      - run: npm audit --omit=dev --audit-level=high

  # npm 12+ bloqueia scripts de instalacao de dependencias que nao estejam em
  # "allowScripts" (package.json). Sem eles o Prisma Client nao e gerado e
  # modulos nativos (argon2) podem nao compilar. Este job instala como uma
  # maquina nova com npm atual e falha se alguma dependencia nova precisar
  # de aprovacao, para o problema aparecer aqui e nao no cliente.
  install-npm-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes npm@12 ci
      - name: Nenhum script de instalacao pendente de aprovacao
        run: |
          npx --yes npm@12 approve-scripts --allow-scripts-pending | tee pending.txt
          grep -q "No packages with unreviewed install scripts" pending.txt
      - name: Prisma Client gerado e argon2 carregando
        run: |
          # O client "stub" (gerado sem achar o schema) nao tem os enums.
          grep -q "ADMIN" node_modules/.prisma/client/index.d.ts
          node -e "require('argon2').hash('ci').then(() => console.log('argon2 ok'))"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t nexus-erp-api .
      - run: docker build -f apps/web/Dockerfile -t nexus-erp-web .
