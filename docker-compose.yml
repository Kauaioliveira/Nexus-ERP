# Ambiente local completo. Para desenvolvimento, normalmente so
# postgres e redis sobem aqui e api/web rodam com npm run dev:*.
# As credenciais abaixo sao exclusivas do ambiente local de desenvolvimento.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus_erp
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Segredos (JWT etc.) vem do seu apps/api/.env local, que nao e versionado.
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus_erp?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3333
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '3333:3333'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:3333/v1
    ports:
      - '3000:3000'

volumes:
  postgres-data:
